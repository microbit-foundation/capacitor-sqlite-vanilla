name: Continuous integration
on:
  release:
    types: [created]
  push:
    branches:
      - '**'

env:
  # renovate: datasource=npm depName=npm
  NPM_VERSION: '11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run eslint && npm run prettier -- --check

      - name: Build
        run: npm run build

  verify-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'jetbrains'
          java-version-file: '.java-version'

      - name: Verify
        run: npm run verify:android

  verify-ios:
    runs-on: macos-15
    steps:
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app

      - name: Prepare simulator runtime
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: SwiftLint
        run: npm run swiftlint -- lint

      - name: Verify
        run: npm run verify:ios

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build, verify-ios, verify-android]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org

      - uses: microbit-foundation/npm-package-versioner-action@v3

      - name: Install plugin dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-tarball
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org
      - run: npm stage publish --allow-file=all ./*.tgz
