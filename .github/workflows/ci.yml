name: Continuous integration
on:
  release:
    types: [created]
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11 --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run eslint && npm run prettier -- --check

      - name: Build
        run: npm run build

  verify-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11 --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'jetbrains'
          java-version-file: '.java-version'

      - name: Verify
        run: npm run verify:android

  verify-ios:
    runs-on: macos-15
    steps:
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app

      - name: Prepare simulator runtime
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11 --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: SwiftLint
        run: npm run swiftlint -- lint

      - name: Verify
        run: npm run verify:ios

  release:
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    needs: [build, verify-ios, verify-android]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@11 --registry=https://registry.npmjs.org

      - uses: microbit-foundation/npm-package-versioner-action@v3

      - name: Install plugin dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - run: npm publish --allow-directory=all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
